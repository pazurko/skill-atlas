name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Check code formatting
      run: cargo fmt --all -- --check

    - name: Lint with Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run unit & integration tests
      run: cargo test --all-targets --verbose

    - name: Build release binary
      run: cargo build --release

  visual-e2e:
    name: Web UI Visual Regression & Video (Playwright)
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build release binary
      run: cargo build --release

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci || npm install

    - name: Install Playwright browsers with OS dependencies
      run: npx playwright install --with-deps chromium

    - name: Run Playwright Visual & Video Tests
      run: npm run test:e2e

    - name: Generate Visual Step Summary
      if: always()
      run: |
        echo "## 🎬 Web UI Demo Video & Visual Playwright Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎥 Automated End-to-End Demo Walkthrough" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<p align=\"center\"><img src=\"https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/screenshots/webui-demo.gif\" width=\"800\" alt=\"Skill Atlas Web UI Demo Video\" /></p>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📸 Visual Screenshots Captured in CI" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Scenario | Screenshot Preview |" >> $GITHUB_STEP_SUMMARY
        echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
        echo "| **01 - Landing Page (Default)** | <img src=\"https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/screenshots/01-landing-page-default.png\" width=\"400\" /> |" >> $GITHUB_STEP_SUMMARY
        echo "| **02 - Landing Page (Toggled Theme)** | <img src=\"https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/screenshots/02-landing-page-toggled-theme.png\" width=\"400\" /> |" >> $GITHUB_STEP_SUMMARY
        echo "| **03 - Scanned Results View** | <img src=\"https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/screenshots/03-scanned-results-view.png\" width=\"400\" /> |" >> $GITHUB_STEP_SUMMARY
        echo "| **04 - Filtered Results** | <img src=\"https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/screenshots/04-filtered-results.png\" width=\"400\" /> |" >> $GITHUB_STEP_SUMMARY
        echo "| **05 - Center Peek Modal** | <img src=\"https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/screenshots/05-center-peek-modal.png\" width=\"400\" /> |" >> $GITHUB_STEP_SUMMARY
        echo "| **06 - Multi-Repository Scan** | <img src=\"https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/screenshots/06-multi-repo-scan.png\" width=\"400\" /> |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎥 Recorded test videos, animated GIFs, and complete HTML reports are downloadable in the workflow artifacts above." >> $GITHUB_STEP_SUMMARY

    - name: Upload Playwright Visual Artifacts (Videos, Screenshots & Reports)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-visual-report
        path: |
          playwright-report/
          test-results/
          screenshots/
        retention-days: 14
