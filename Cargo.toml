[package]
name = "skill-atlas"
version = "0.1.0"
edition = "2021"
description = "Interactive CLI to scan GitHub repositories for AI agent skills"
authors = ["Skill Atlas Contributors"]
license = "MIT"

[[bin]]
name = "skill-atlas"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
crossterm = "0.28"
open = "5.3"
colored = "2.2"
regex = "1.11"
thiserror = "2.0"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
chrono = "0.4"
axum = "0.7"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
